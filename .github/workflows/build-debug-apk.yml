name: Build Debug APK

# Runs on every push to main, or manually from the Actions tab (Run workflow).
on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Core modules are present
        run: |
          for m in common data domain media/media3 media/media3-ui media/media-jvm media/media-jvm-ui \
                   service/ktorExt service/kotlinYtmusicScraper service/spotify service/aiService \
                   service/autoEqService service/lyricsService service/kizzy service/listenTogether service/loginSync; do
            test -f "core/$m/build.gradle.kts" || { echo "::error::core/$m/build.gradle.kts is missing"; exit 1; }
          done
          echo "All Core modules present."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK (accepts licenses)
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK (FOSS stubs for Crashlytics/Cast/Last.fm)
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleDebug -PisFullBuild=false --stacktrace 2>&1 | tee build.log

      - name: Summarize result
        if: always()
        run: |
          {
            echo "## Build result: ${{ job.status }}"
            echo
            echo '### APK files'
            find . -path '*/build/outputs/apk/debug/*.apk' -exec ls -lh {} \; || true
            echo
            echo '### First errors in log'
            echo '```'
            grep -nE "^e: |FAILURE|What went wrong|Could not resolve|error:|Execution failed" build.log 2>/dev/null | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WAIFU_SLAYER_DEBUG_APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

      - name: Upload build log and reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            **/build/reports/**
          if-no-files-found: ignore
